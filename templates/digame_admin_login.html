<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dígame</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f3f4f6; }
    main { max-width: 520px; margin: 0 auto; background: white; border-radius: 14px; padding: 24px; box-shadow: 0 14px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    label { display: block; margin-bottom: 16px; }
    input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #d1d5db; }
    button { border: none; border-radius: 10px; padding: 14px 18px; background: #2563eb; color: white; font-size: 1rem; cursor: pointer; }
    .notice { background: #eef2ff; color: #1e3a8a; padding: 12px; border-radius: 10px; margin: 18px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Administración Dígame</h1>
    <p class="notice">Introduce la clave de administración para acceder al panel.</p>
    <form method="post">
      <label>Clave de administrador
        <input type="password" name="admin_key" autocomplete="current-password" required />
      </label>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
