<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Fondo oscuro redondeado -->
  <rect x="4" y="4" width="56" height="56" rx="16" ry="16" fill="#020617"/>

  <!-- Borde con degradado -->
  <rect x="6" y="6" width="52" height="52" rx="14" ry="14"
        fill="none" stroke="url(#grad)" stroke-width="2.5"/>

  <!-- Letra M ligeramente subida para centrar ópticamente -->
  <text
    x="50%"
    y="55%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="700"
    font-size="32"
    fill="url(#grad)">
    M
  </text>
</svg>
