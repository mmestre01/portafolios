<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BuscaGas · Gasolineras en ruta</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
  <link rel="stylesheet" href="static/styles.css?v=7">
</head>
<body>
  <header class="hero">
    <h1>Gasolineras en ruta</h1>
    <p>Encuentra dónde repostar más barato sin desviarte demasiado.</p>
  </header>
  <main class="shell">
    <form id="search-form" class="search-card">
      <div class="field autocomplete"><label for="origin">Origen</label><input id="origin" autocomplete="off" placeholder="Madrid" maxlength="200" required><div class="suggestions" id="origin-results"></div></div>
      <button type="button" class="swap" aria-label="Intercambiar origen y destino">⇅</button>
      <div class="field autocomplete"><label for="destination">Destino</label><input id="destination" autocomplete="off" placeholder="Valencia" maxlength="200" required><div class="suggestions" id="destination-results"></div></div>
      <div class="field"><label for="fuel">Combustible</label><select id="fuel"><option value="diesel">Diésel</option><option value="gasolina_95">Gasolina 95</option><option value="gasolina_98">Gasolina 98</option><option value="diesel_premium">Diésel premium</option></select></div>
      <div class="field"><label for="autonomy">Autonomía disponible</label><div class="input-suffix"><input type="number" id="autonomy" min="1" max="1500" step="1" value="300" required><span>km</span></div></div>
      <div class="field slider-field"><label for="detour">Desvío máximo: <strong id="detour-value">10 minutos</strong></label><input type="range" id="detour" min="0" max="30" step="1" value="10"><div class="range-labels"><span>0 min</span><span>30 min</span></div></div>
      <button class="primary" id="submit" type="submit">Buscar gasolineras <span>→</span></button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <section id="summary" class="summary hidden"></section>
    <section id="results-layout" class="results-layout hidden">
      <div class="map-wrap">
        <div id="map" aria-label="Mapa de la ruta"></div>
        <div class="map-legend" aria-label="Leyenda del mapa">
          <span><i class="legend-route"></i> Ruta</span>
          <span><i class="legend-origin">A</i> Origen</span>
          <span><i class="legend-destination">B</i> Destino</span>
          <span><i class="legend-station"></i> Gasolinera</span>
        </div>
        <button id="reset-map" class="reset-map" type="button">Ver ruta completa</button>
      </div>
      <div class="results-panel"><div class="results-head"><div><span class="eyebrow">MEJORES OPCIONES</span><h2>Gasolineras encontradas</h2></div><span id="count" class="count"></span></div><div id="stations"></div></div>
    </section>
  </main>
  <footer>Datos de precios del Ministerio de Industria · Rutas de openrouteservice · © OpenStreetMap</footer>
  <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
  <script src="static/app.js?v=7"></script>
</body>
</html>
